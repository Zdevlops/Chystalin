name: Build Chystalin APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 35
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/Chystalin-1.0.0.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chystalin-debug
          path: out/Chystalin-1.0.0.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Chystalin v1.0.0
          body: |
            Aplikasi pemutar musik offline Chystalin.
            - Impor musik dari penyimpanan
            - Unduh lagu lewat tautan langsung
            - Playlist + atur rotasi putar (sekali, ulang semua, ulang satu, acak)
          files: out/Chystalin-1.0.0.apk
          make_latest: true
